<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <g transform="translate(256, 256)">
    <!-- 8-point geometric asterisk / spark -->
    <rect x="-36" y="-216" width="72" height="432" rx="36" class="star-arm" />
    <rect x="-36" y="-216" width="72" height="432" rx="36" transform="rotate(45)" class="star-arm" />
    <rect x="-36" y="-216" width="72" height="432" rx="36" transform="rotate(90)" class="star-arm" />
    <rect x="-36" y="-216" width="72" height="432" rx="36" transform="rotate(135)" class="star-arm" />
    <circle r="44" class="star-center" />
  </g>
  <style>
    .star-arm, .star-center {
      fill: #111111;
    }
    @media (prefers-color-scheme: dark) {
      .star-arm, .star-center {
        fill: #ffffff;
      }
    }
  </style>
</svg>